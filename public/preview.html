engine.mount(room);

// Drive the clock by hand so a screenshot can be taken at an exact moment.
let t = 0;
// The engine's runClock() returns its step-driven manualElapsed ONLY while
// runEpoch is unset; setting an epoch switches it to wall time, which freezes
// every room under manual stepping. So this never touches the epoch, and it
// never rewinds - manualElapsed is monotonic and cannot go back.
//
// To reach a moment already passed, pass the animation's period: the harness
// walks FORWARD to the next time congruent to it. Every room here is periodic,
// so that lands on an identical frame.
window.__seek = (target, period) => {
  const dt = 1 / 60;
  let goal = target;
  if (goal < t) {
    if (!period) throw new Error(`__seek(${target}) is in the past; pass a period to wrap`);
    goal = t + ((target - t) % period + period) % period;
  }
  while (t < goal) { engine.step(dt); t += dt; }
  return t;
};
window.__now = () => t;

window.__look = (x, y, z, yaw, pitch = 0) => {
  const { camera, renderer, scene } = engine;
  camera.position.set(x, y, z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  renderer.render(scene, camera);
};

// Read the glyph the RENDERER is actually showing in each window: raycast at

// the only check that can catch the logic and the geometry disagreeing.
window.__readWindows = () => {
  const ray = new THREE.Raycaster();
  let drums = null;
  engine.scene.traverse((o) => { if (o.isInstancedMesh && o.instanceColor) drums = o; });
  return PUZZLE.drumOffsets.map((_, i) => {
    const z = [-2.5, -1.5, -0.5, 0.5, 1.5, 2.5][i];
    ray.set(new THREE.Vector3(1.6, 1.45, z), new THREE.Vector3(1, 0, 0));
    const hit = ray.intersectObject(drums, false)[0];
    if (!hit || !hit.uv) return null;
    const cell = Math.floor(hit.uv.x * 8) % 8;
    return { cell, glyph: PUZZLE.collars[cell].glyph, frac: +(hit.uv.x * 8 % 1).toFixed(2) };
  });
};
